services:
  ollapdf:
    build: .
    container_name: manzolo-ollapdf-rag
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llama2}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.1}
      - DEFAULT_CHUNK_SIZE=${DEFAULT_CHUNK_SIZE:-1000}
      - DEFAULT_CHUNK_OVERLAP=${DEFAULT_CHUNK_OVERLAP:-200}
      - DEFAULT_TOP_K=${DEFAULT_TOP_K:-4}
      - OCR_API_URL=${OCR_API_URL:-}
      - OCR_API_TOKEN=${OCR_API_TOKEN:-}
      - OCR_MIN_TEXT_LENGTH=${OCR_MIN_TEXT_LENGTH:-50}
    networks:
      - ollapdf-net

networks:
  ollapdf-net: