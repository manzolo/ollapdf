name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: docker build -t ollapdf-test .

      - name: Run unit tests
        run: docker run --rm ollapdf-test python -m pytest tests/ -v -m "not integration"

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      OLLAMA_MODEL_NAME: tinyllama

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app image
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Pull Ollama and pre-pull model
        run: |
          docker pull ollama/ollama
          docker run -d -p 11434:11434 --name temp-ollama \
            -v ${{ github.workspace }}/ollama_data:/root/.ollama \
            ollama/ollama
          ./wait-for-it.sh localhost:11434 --timeout=120
          docker exec temp-ollama ollama pull tinyllama
          docker stop temp-ollama
          docker rm temp-ollama

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Wait for Ollama
        run: ./wait-for-it.sh localhost:11434 --timeout=120

      - name: Wait for app
        run: |
          ./wait-for-it.sh localhost:8501 --timeout=60
          sleep 10

      - name: Run integration tests
        run: docker exec manzolo-ollapdf-rag python -m pytest tests/ -v -m integration

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

      - name: Clean up Docker
        if: always()
        run: docker system prune -f
